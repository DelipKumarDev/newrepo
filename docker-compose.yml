version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:5173
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
    depends_on: []

  frontend:
    build: ./frontend-admin
    ports:
      - '5173:80'
    environment:
      - VITE_API_URL=http://localhost:3001/api

  # Optional local Mongo for development (commented out when using Atlas)
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  # Reverse proxy + TLS (Let's Encrypt with certbot)
  reverse-proxy:
    image: nginx:stable-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/www:/var/www/certbot:rw
      - ./nginx/certs:/etc/letsencrypt:rw
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/www:/var/www/certbot:rw
      - ./nginx/certs:/etc/letsencrypt:rw
    entrypoint: ['sh', '-c', 'while :; do sleep 6h & wait $${!}; done;']

volumes:
  mongo-data:
  nginx-certs:

