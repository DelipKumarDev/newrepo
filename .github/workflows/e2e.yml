name: e2e-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")'" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (backend)
        run: npm ci
        working-directory: backend
      - name: Run e2e tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/newrepo_ci
          JWT_SECRET: test_jwt
          REFRESH_SECRET: test_refresh
        run: npm run test:e2e
